<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silicon Chef — Masak PC</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2118; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Dibaca, tidak ditampilkan: baris status yang diumumkan pembaca layar. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Silicon Chef: masak komponen PC kecil — SSD, RAM, GPU dan kawan-kawan — jadi PC utuh dan sajikan sebelum order kedaluwarsa"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
